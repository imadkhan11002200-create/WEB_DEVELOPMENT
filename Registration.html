<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>

    <fieldset>
        <legend> Students Details</legend>
        <label for="fname"> First_Name:</label>
        <input type="text" name="Std_Name" id="fname" placeholder="Enter Name"> <br> <br>
        <label for="lname"> Last_Name:</label>
        <input type="text" name="Std_Name" id="lname" placeholder="Enter Name"> <br><br>
        <label for="eml"> Email:</label>
        <input type="email" name="email" id="eml" placeholder="abc@gmail.com"> <br><br>
        <label for="pass"> Password:</label>
        <input type="password" name="password" id="pass" placeholder="strongpass" required> <br> <br>
        <input type="button" value="Submit">
    </fieldset>
</body>
</html>
